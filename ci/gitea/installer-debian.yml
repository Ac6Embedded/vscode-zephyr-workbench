# Host tools installer (scripts/hosttools) on Debian: Gitea Actions workflow.
#
# This file is meant for the workbench-ci repository: copy it to
# .gitea/workflows/installer-debian.yml there. That repository holds only CI,
# so the workbench sources are cloned from GitHub instead of checked out.
#
# Runs once a week, on Friday evening, and on demand (Run workflow, where the
# repository and the ref to test can be changed). Never on a push.
#
# It runs the real installer, as root and without sudo, in containers of the
# supported Debian releases on x86_64. It downloads a few hundred MB.

name: Installer (Debian)

on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub repository to test (owner/name)'
        default: 'Ac6Embedded/vscode-zephyr-workbench'
      ref:
        description: 'Branch or tag to test'
        default: 'pre-release'

env:
  # A scheduled run has no inputs, so it falls back to the defaults.
  WORKBENCH_REPO: ${{ github.event.inputs.repo || 'Ac6Embedded/vscode-zephyr-workbench' }}
  WORKBENCH_REF: ${{ github.event.inputs.ref || 'pre-release' }}

jobs:
  debian:
    name: ${{ matrix.image }} (x86_64)
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13']
    steps:
      # A container image ships neither curl nor git. The installer needs one
      # of wget or curl. actions/checkout is not used: it needs Node in the
      # image, which the runner does not provide, and it would look for the
      # repository on this Gitea instead of GitHub. Node is installed for any
      # JavaScript action added to this job later.
      - name: Prerequisites of a minimal image
        shell: sh
        run: apt-get update && apt-get install -y curl ca-certificates git nodejs

      - name: Clone the workbench
        run: |
          git clone --depth 1 --branch "$WORKBENCH_REF" \
            "https://github.com/$WORKBENCH_REPO.git" "${RUNNER_TEMP:-/tmp}/workbench"

      - name: Platform detection
        run: |
          "${RUNNER_TEMP:-/tmp}/workbench/scripts/hosttools/install.sh" --selftest-platform

      - name: Install, as root and without sudo, as in a fresh container
        run: |
          "${RUNNER_TEMP:-/tmp}/workbench/scripts/hosttools/install.sh" \
            --tools system,cmake,ninja,python,venv "${RUNNER_TEMP:-/tmp}/zinstaller"

      - name: Installed tools run
        run: |
          dir="${RUNNER_TEMP:-/tmp}/zinstaller"
          "$dir"/tools/cmake-*/bin/cmake --version
          "$dir"/tools/ninja/ninja --version
          "$dir"/.venv/bin/python --version
          "$dir"/.venv/bin/west --version
